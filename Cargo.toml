[package]
name = "minefield"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "minefield"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
server = ["dep:axum", "dep:tokio", "dep:rand"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"], optional = true }
rand = { version = "0.9", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
